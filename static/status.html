<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>esp-eBus Status</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <h1>Status</h1>
    <div class="controls">
        <button id="btnHome">Home</button>
        <button id="btnHealth">Health</button>
        <button id="btnHeap">Heap</button>
        <button id="btnTasks">Tasks</button>
        <button id="btnSystem">System</button>
        <button id="btnNetwork">Network</button>
        <button id="btnDump">Download dump</button>
        <span id="status">...</span>
        <button id="btnRefresh" style="margin-left:auto;">Refresh</button>
    </div>
    <div class="container" id="statusContainer"></div>
    <div class="container" id="heapContainer" style="display:none">
        <h2>heap</h2>
        <div id="heapCurrent"></div>
        <h2>trend</h2>
        <table>
            <thead id="heapTableHeader"></thead>
            <tbody id="heapTableBody"></tbody>
        </table>
    </div>
    <div class="container" id="tasksContainer" style="display:none">
        <h2>stacks</h2>
        <table>
            <thead id="threadsTableHeader"></thead>
            <tbody id="threadsTableBody"></tbody>
        </table>
        <h2>cpu share</h2>
        <table>
            <thead id="cpuTableHeader"></thead>
            <tbody id="cpuTableBody"></tbody>
        </table>
    </div>
    <script src="common.js"></script>
    <script>
        let currentView = 'health';
        const availability = {};
        // Lazy probe: the first click on a button both checks availability
        // (hides the button on bridge builds) and renders the response —
        // one GET, no 5-way salvo on page open.
        async function loadView(name, btn, container, path, render) {
            currentView = name;
            if (availability[btn] === false) return;
            showView(container);
            setStatus('Loading...');
            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error('unavailable');
                availability[btn] = true;
                render(await res.json());
                setStatus('Fetched');
            } catch (err) {
                availability[btn] = false;
                document.getElementById(btn).style.display = 'none';
                setStatus('Unavailable');
                console.error(err);
            }
        }
        const viewLoaders = {
            health: loadHealth, system: loadSystem, network: loadNetwork,
            heap: loadHeap, tasks: loadTasks,
        };
        function loadHealth() {
            loadView('health', 'btnHealth', 'statusContainer', '/api/v1/health', data => {
                renderSummaryTable(data, 'statusContainer');
                // Staged config: NVS saved but not yet applied (restart
                // pending). Key names only — no secret values in the UI.
                fetch('/api/v1/app/config/drift').then(res => {
                    if (!res.ok) return;
                    return res.json();
                }).then(drift => {
                    if (!drift || !drift.staged) return;
                    const keys = (drift.keys || []).join(', ');
                    const banner = document.createElement('div');
                    banner.style.cssText = 'padding:8px;margin-bottom:8px;border:1px solid #ddd;background:#fff8e1;';
                    banner.textContent = 'Staged config changes — restart to apply: ' + keys;
                    const c = document.getElementById('statusContainer');
                    c.insertBefore(banner, c.firstChild);
                }).catch(() => { });
            });
        }
        function loadSystem() {
            loadView('system', 'btnSystem', 'statusContainer', '/api/v1/system', data => {
                renderTables(data, 'statusContainer');
            });
        }
        function loadNetwork() {
            loadView('network', 'btnNetwork', 'statusContainer', '/api/v1/network', data => {
                renderTables(data, 'statusContainer');
            });
        }
        function loadHeap() {
            loadView('heap', 'btnHeap', 'heapContainer', '/api/v1/system/heap', data => {
                const cur = data.current || {};
                document.getElementById('heapCurrent').textContent =
                    `free: ${cur.free} / min: ${cur.min} / largest: ${cur.largest}`;
                const trend = data.trend || [];
                const cols = ['uptime', 'free', 'min', 'largest'];
                renderRows('heapTableHeader', 'heapTableBody', cols, trend);
            });
        }
        function loadTasks() {
            loadView('tasks', 'btnTasks', 'tasksContainer', '/api/v1/system/tasks', data => {
                renderRows('threadsTableHeader', 'threadsTableBody',
                    ['name', 'stack_size', 'stack_free'], data.threads || [], true);
                renderRows('cpuTableHeader', 'cpuTableBody',
                    ['name', 'percent', 'priority'], data.cpu || [], true);
            });
            // CPU percent is delta-based: the first sample reads zero.
            // One follow-up fetch fills real values without polling.
            setTimeout(() => {
                if (document.getElementById('tasksContainer').style.display !== 'none') {
                    loadTasksOnce();
                }
            }, 3000);
        }
        // Single tasks fetch without scheduling another follow-up.
        function loadTasksOnce() {
            loadView('tasks', 'btnTasks', 'tasksContainer', '/api/v1/system/tasks', data => {
                renderRows('threadsTableHeader', 'threadsTableBody',
                    ['name', 'stack_size', 'stack_free'], data.threads || [], true);
                renderRows('cpuTableHeader', 'cpuTableBody',
                    ['name', 'percent', 'priority'], data.cpu || [], true);
            });
        }
        function showView(id) {
            for (const v of ['statusContainer', 'heapContainer', 'tasksContainer']) {
                document.getElementById(v).style.display = v === id ? '' : 'none';
            }
        }
        document.getElementById('btnHome').addEventListener('click', handleHome);
        document.getElementById('btnHealth').addEventListener('click', loadHealth);
        document.getElementById('btnHeap').addEventListener('click', loadHeap);
        document.getElementById('btnTasks').addEventListener('click', loadTasks);
        document.getElementById('btnSystem').addEventListener('click', loadSystem);
        document.getElementById('btnNetwork').addEventListener('click', loadNetwork);
        document.getElementById('btnRefresh').addEventListener('click', () => {
            // Refresh reloads the currently visible view, not always health.
            (viewLoaders[currentView] || loadHealth)();
        });

        // Initial load: health only. Other views probe lazily on
        // first click (see loadView); nothing else is fetched.
        loadHealth();

        // Support dump: same read-only endpoint set as dump_endpoints.sh
        // (never POST/action endpoints). Tasks is fetched twice because
        // CPU percent is delta-based and a single sample reads zero.
        document.getElementById('btnDump').addEventListener('click', async () => {
            const btn = document.getElementById('btnDump');
            btn.disabled = true;
            const eps = [
                'api/v1/health', 'api/v1/system', 'api/v1/system/heap',
                'api/v1/system/tasks', 'api/v1/network', 'api/v1/devices',
                'api/v1/metrics', 'api/v1/app/values', 'api/v1/app/logs',
                'api/v1/app/tap', 'api/v1/app/config',
            ];
            const now = new Date();
            const result = {
                _meta: {
                    host: window.location.hostname,
                    timestamp_ms: Date.now(),
                    timestamp_utc: now.toISOString().replace(/\.\d+Z$/, 'Z'),
                },
            };
            const total = eps.length;
            for (let i = 0; i < eps.length; i++) {
                const ep = eps[i];
                setStatus(`Dump ${i + 1}/${total}: ${ep}...`);
                try {
                    if (ep === 'api/v1/system/tasks') {
                        try { await fetch('/' + ep); } catch (e) { /* warm-up only */ }
                        await new Promise(r => setTimeout(r, 3000));
                    }
                    const res = await fetch('/' + ep);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    result[ep] = await res.json();
                } catch (err) {
                    result[ep] = { _error: String((err && err.message) || err) };
                }
            }
            const stamp = now.toISOString().replace(/[-:]/g, '').slice(0, 15);
            const blob = new Blob([JSON.stringify(result, null, 1) + '\n'],
                { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `ebus_dump_${stamp}.json`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(a.href);
                a.remove();
            }, 1000);
            setStatus('Dump downloaded');
            btn.disabled = false;
        });

    </script>
</body>

</html>
