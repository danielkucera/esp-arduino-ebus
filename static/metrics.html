<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>esp-eBus Metrics</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <h1>Metrics</h1>
    <div class="controls">
        <button id="btnHome">Home</button>
        <button id="btnMetricsReset" class="danger">Metrics Reset</button>
        <button id="btnBreakerReset" class="danger">Breaker Reset</button>
        <span id="status">...</span>
        <button id="btnRefresh" style="margin-left:auto;">Refresh</button>
    </div>
    <div class="container" id="metricsContainer"></div>
    <script src="common.js"></script>
    <script>
        // Lib telemetry only (app data lives on status-cluster pages).
        function loadMetrics() {
            fetchJson('/api/v1/metrics', data => {
                renderTables(data, 'metricsContainer');
            }, 'Loading metrics...');
        }
        document.getElementById('btnHome').addEventListener('click', handleHome);
        document.getElementById('btnRefresh').addEventListener('click', loadMetrics);
        document.getElementById('btnMetricsReset').addEventListener('click', () => {
            postSimple('/api/v1/metrics/reset').then(loadMetrics);
        });
        document.getElementById('btnBreakerReset').addEventListener('click', () => {
            postSimple('/api/v1/metrics/breaker/reset').then(() => setStatus('Breaker Reset'));
        });

        // Initial load
        loadMetrics();
    </script>
</body>

</html>
