<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>esp-eBus Values</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <h1>Values</h1>
    <div class="controls">
        <button id="btnHome">Home</button>
        <span id="status">...</span>
        <button id="btnRefresh" style="margin-left:auto">Refresh</button>
    </div>
    <table>
        <thead id="valuesTableHeader"></thead>
        <tbody id="valuesTableBody"></tbody>
    </table>
    <script src="common.js"></script>
    <script>
        // No auto-poll: single load on open, Refresh on demand (Devices
        // pattern). Background polling kept the bus thread under permanent
        // HTTP/TCP load.
        function handleValues() {
            fetchJson('/api/v1/app/values', data => renderValuesTable(data), 'Fetching values...');
        }

        function renderValuesTable(data) {
            const thead = document.getElementById('valuesTableHeader');
            const tbody = document.getElementById('valuesTableBody');

            // HA enum display name wins over the raw number when present.
            // Page-local: only this table knows the text/value row shape.
            function cellText(item, col) {
                if (col === 'value' && item.text !== undefined) return String(item.text);
                return (item[col] === undefined ? '' : String(item[col]));
            }

            // Initialize headers if empty
            if (thead.children.length === 0) {
                const cols = ['key', 'name', 'value', 'unit', 'age'];
                const trh = document.createElement('tr');
                cols.forEach(k => {
                    const th = document.createElement('th');
                    th.textContent = k;
                    trh.appendChild(th);
                });
                const thActions = document.createElement('th');
                thActions.textContent = 'actions';
                trh.appendChild(thActions);
                thead.appendChild(trh);
            }

            // Create a map of existing rows by key
            const existingRows = {};
            tbody.querySelectorAll('tr').forEach(tr => {
                const input = tr.querySelector('input[type="text"]');
                if (input) {
                    const key = input.getAttribute('data-key');
                    existingRows[key] = tr;
                }
            });

            const cols = ['key', 'name', 'value', 'unit', 'age'];

            // Multi-field commands arrive as one row per field (backend
            // flattened): row identity is key+field, but Read polls the
            // whole telegram — only the first row per key carries it.
            const seenKeys = new Set();
            const firstOfKey = new Set();
            data.forEach(item => {
                const rid = (item.key || '') + '\x1f' + (item.field || '');
                if (!seenKeys.has(item.key)) {
                    seenKeys.add(item.key);
                    firstOfKey.add(rid);
                }
            });

            // Update or create rows
            data.forEach(item => {
                const cmdKey = item.key || '';
                const rowId = cmdKey + '\x1f' + (item.field || '');
                const wantRead = firstOfKey.has(rowId);
                let tr = existingRows[rowId];

                if (tr) {
                    // Read-button placement may have changed (single <->
                    // multi field): rebuild the row when it mismatches.
                    const hasRead = !!tr.querySelector('button[data-act="read"]');
                    if (wantRead !== hasRead) {
                        tr.remove();
                        delete existingRows[rowId];
                        tr = null;
                    }
                }

                if (tr) {
                    // Update existing row - only update display cells, not input
                    const tds = tr.querySelectorAll('td');
                    cols.forEach((col, idx) => {
                        if (tds[idx]) {
                            tds[idx].textContent = cellText(item, col);
                        }
                    });

                    // Update button states (write, active) but keep input focus and value
                    const input = tr.querySelector('input[type="text"]');
                    const btnWrite = tr.querySelector('button[data-act="write"]');
                    const btnRead = tr.querySelector('button[data-act="read"]');

                    if (input) input.disabled = !item.write;
                    if (btnWrite) btnWrite.disabled = !item.write;
                    if (btnRead) btnRead.disabled = !item.active;
                } else {
                    // Create new row
                    tr = document.createElement('tr');
                    cols.forEach(k => {
                        const td = document.createElement('td');
                        td.textContent = cellText(item, k);
                        tr.appendChild(td);
                    });

                    // Create actions cell: input + Write + Read
                    const tdActions = document.createElement('td');
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = 'new value';
                    input.style.width = '6rem';
                    input.value = '';
                    input.disabled = !item.write;
                    input.setAttribute('data-key', rowId);

                    const btnWrite = document.createElement('button');
                    btnWrite.textContent = 'Write';
                    btnWrite.setAttribute('data-act', 'write');
                    btnWrite.disabled = !item.write;
                    btnWrite.addEventListener('click', () => writeValue(cmdKey, input, btnWrite));

                    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnWrite.click(); });
                    tdActions.appendChild(input);
                    tdActions.appendChild(btnWrite);

                    if (wantRead) {
                        const btnRead = document.createElement('button');
                        btnRead.textContent = 'Read';
                        btnRead.setAttribute('data-act', 'read');
                        btnRead.disabled = !item.active;
                        btnRead.addEventListener('click', () => readValue(cmdKey, btnRead));
                        tdActions.appendChild(btnRead);
                    }

                    tr.appendChild(tdActions);
                    tbody.appendChild(tr);
                    existingRows[rowId] = tr;
                }
            });

            // Remove rows that are no longer in data
            const dataKeys = new Set(data.map(item => (item.key || '') + '\x1f' + (item.field || '')));
            tbody.querySelectorAll('tr').forEach(tr => {
                const input = tr.querySelector('input[type="text"]');
                if (input) {
                    const key = input.getAttribute('data-key');
                    if (!dataKeys.has(key)) {
                        tr.remove();
                    }
                }
            });
        }

        async function writeValue(key, inputEl, btnEl) {
            if (!inputEl || !btnEl) return;
            btnEl.disabled = true;
            setStatus('Setting...');
            try {
                const raw = inputEl.value;
                const num = Number(raw);
                const payload = (raw !== '' && isFinite(num)) ? { key: key, value: num } : { key: key, value: raw };
                const res = await fetch('/api/v1/app/values/write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const text = await res.text();
                setStatus(text || (res.ok ? 'OK' : 'Error'));
            } catch (err) {
                console.error(err);
                setStatus('Error');
            } finally {
                btnEl.disabled = false;
            }
        }

        async function readValue(key, btnEl) {
            if (!btnEl) return;
            btnEl.disabled = true;
            setStatus('Requested, waiting...');
            try {
                const payload = { key: key };
                const res = await fetch('/api/v1/app/values/read', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const text = await res.text();
                    setStatus(text || 'Error');
                } else {
                    // wait 3 seconds then refresh the whole table to reflect latest value
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    await handleValues();
                    setStatus('Fetched');
                }
            } catch (err) {
                console.error(err);
                setStatus('Error');
            } finally {
                btnEl.disabled = false;
            }
        }

        document.getElementById('btnHome').addEventListener('click', handleHome);
        document.getElementById('btnRefresh').addEventListener('click', handleValues);

        // Initial load
        handleValues();
    </script>
</body>

</html>
