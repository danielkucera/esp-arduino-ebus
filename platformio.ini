; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = espidf
monitor_filters = esp32_exception_decoder
extra_scripts = pre:auto_firmware_version.py
board_build.sdkconfig_defaults = sdkconfig.defaults
lib_deps = 

build_flags =
    -DESP32=1
board_build.embed_txtfiles =
    static/root.html
    static/config.html
    static/status.html
    static/upgrade.html
    static/adc.html
    static/common.css
    static/common.js
    static/commands.html
    static/cron.html
    static/devices.html
    static/logs.html
    static/statistics.html
    static/values.html

[env:esp32-c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DRESET_PIN=20
    -DPWM_PIN=6

monitor_filters = esp32_exception_decoder
lib_deps = 
    ${env.lib_deps}

[env:esp32-c3-ota]
extends = env:esp32-c3
upload_port = esp-ebus.local
upload_protocol = espota

[env:esp32-c3-internal]
extends = env:esp32-c3

build_flags =
    ${env.build_flags}
    -DRESET_PIN=20
    -DPWM_PIN=6
    -DEBUS_INTERNAL=1
    # Component Layer
    -DEBUS_TRANSITION_HISTORY_SIZE=5        # Depth of FSM transition history tracking
    # Orchestration Layer
    -DEBUS_CONTROLLER_STACK_SIZE=4096       # Stack size for Controller thread
    -DEBUS_CONTROLLER_PRIORITY=10           # Priority for Controller thread
    -DEBUS_BUS_STACK_SIZE=2048              # Stack size for Bus
    -DEBUS_BUS_PRIORITY=15                  # Priority for Bus thread
    -DEBUS_BUS_SYN_STACK_SIZE=2048          # Stack size for Bus SYN thread
    -DEBUS_BUS_SYN_PRIORITY=5               # Priority for Bus SYN thread
    -DEBUS_BUS_HANDLER_STACK_SIZE=3072      # Stack size for BusHandler
    -DEBUS_BUS_HANDLER_PRIORITY=10          # Priority for BusHandler thread
    -DEBUS_SCHEDULER_STACK_SIZE=3072        # Stack size for Scheduler
    -DEBUS_SCHEDULER_PRIORITY=10            # Priority for Scheduler thread
    -DEBUS_CLIENT_MANAGER_STACK_SIZE=2048   # Stack size for ClientManager
    -DEBUS_CLIENT_MANAGER_PRIORITY=10       # Priority for ClientManager thread
    # Bus Layer
    -DEBUS_BUS_QUEUE_SIZE=512               # Size of the physical bus event queue
    -DEBUS_MAX_LISTENERS=4                  # Maximum number of internal bus listeners
    # Diagnostics Layer
    -DEBUS_LOG_HISTORY_SIZE=5               # Number of error entries to keep in memory
    -DEBUS_TRACE_HISTORY_SIZE=5             # Number of trace events to keep in memory
    # Networking Layer
    -DEBUS_MAX_CLIENTS=4                    # Maximum number of network bridge clients
    # Application Layer
    -DEBUS_PUBLIC_QUEUE_SIZE=16             # Size of the public event queue
    -DEBUS_MAX_MANUAL_QUEUE=16              # Maximum pending manual scan requests
    -DEBUS_SCHEDULER_MAX_ITEMS=16           # Maximum items in the priority scheduler
    -DEBUS_POLL_MAX_ITEMS=128               # Maximum items in the poll manager

lib_deps = 
    ${env.lib_deps}
    https://github.com/yuhu-/ebus.git#a6c76cd1ceb21f7b1a114a43bcc557e40eec3034

[env:esp32-c3-internal-ota]
extends = env:esp32-c3-internal
upload_port = esp-ebus.local
upload_protocol = espota

[env:esp32-c3-internal-remote]
extends = env:esp32-c3-internal
extra_scripts =
    ${env.extra_scripts}
    upload_http_pio.py

upload_protocol = custom
upload_port = esp-ebus-remote.test # configured in hosts file
custom_upload_user = admin
custom_upload_password = ebusebus
